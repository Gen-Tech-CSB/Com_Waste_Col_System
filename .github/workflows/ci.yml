
name: Test CI CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify GitHub Actions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Workflow
        run: echo "GitHub Actions is working!"

      - name: Check Flutter Project
        run: |
          test -f pubspec.yaml
          echo "Flutter project found!"

      - name: Check Backend Folder
        run: |
          test -d backend
          echo "Backend folder found!"

      - name: Finish
        run: echo "CI/CD verification completed!"
